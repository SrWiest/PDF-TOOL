stages:
  - build
  - release

variables:
  PMT_BUILD_VERSION: "pre-release-medium-$CI_PIPELINE_IID"

build_medium:
  stage: build
  image: python:3.11
  before_script:
    - apt-get update && apt-get install -y wine
    - python -m pip install --upgrade pip setuptools wheel
    - pip install pyinstaller
    - pip install -r requirements/requirements-medium.txt
  script:
    - echo "Building PDF Tool Medium version..."
    - python -c "import sys; print(f'Python version: {sys.version}')"
    - pip freeze
    # Add your build commands here
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - merge_requests

release_medium:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Creating release for version $PMT_BUILD_VERSION"
    # Add release creation logic here
  dependencies:
    - build_medium
  only:
    - main
