version: 2.1

orbs:
  windows: circleci/windows@5.0

workflows:
  build-and-release:
    jobs:
      - build-windows:
          name: build-medium
          build-type: "medium"
          pyinstaller-spec: "specs/pdf_merge_medium.spec"
          requirements-file: "requirements/requirements-medium.txt"
          filters:
            branches:
              only: main

jobs:
  build-windows:
    executor: windows/default
    parameters:
      build-type:
        type: string
      pyinstaller-spec:
        type: string
      requirements-file:
        type: string
    environment:
      PMT_BUILD_VERSION: << parameters.build-type >>-${CIRCLE_BUILD_NUM}
    steps:
      - checkout

      - run:
          name: Setup Python 3.11
          command: |
            choco install python311 --yes
            echo 'export PATH="/c/Python311:/c/Python311/Scripts:$PATH"' >> $BASH_ENV
            python -m pip install --upgrade pip setuptools wheel

      - run:
          name: Install Python dependencies
          command: |
            pip install pyinstaller
            pip install -r << parameters.requirements-file >>
            pip freeze

      - run:
          name: Prepare external tools (Windows dependencies)
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Preparando ferramentas externas..." -ForegroundColor Green
            $tools = @("qpdf", "poppler", "tesseract", "ghostscript", "mupdf", "pdftk-free")
            foreach ($tool in $tools) {
              Write-Host "Instalando $tool..." -ForegroundColor Yellow
              try {
                choco install $tool --yes --no-progress --force --force-dependencies
              } catch {
                Write-Warning "Falha ao instalar $tool via Chocolatey: $($_.Exception.Message)"
              }
            }
            Write-Host "✅ Instalação de ferramentas externas concluída." -ForegroundColor Green

      - run:
          name: Verify tools setup
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Verificando ferramentas instaladas..." -ForegroundColor Cyan
              python -c "from src.embed_diagnostics import print_status_as_table; print_status_as_table()"

      - run:
          name: Build << parameters.build-type >> executable with PyInstaller
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Construindo executável com PyInstaller..." -ForegroundColor Green
            pyinstaller << parameters.pyinstaller-spec >> --clean

      - run:
          name: Setup Inno Setup
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Instalando Inno Setup..." -ForegroundColor Green
            choco install innosetup --yes

      - run:
          name: Create Windows Installer
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Criando instalador Windows..." -ForegroundColor Green
            $buildType = "<< parameters.build-type >>"
            $spec = "installer/install_$buildType.iss"
            $version = $env:PMT_BUILD_VERSION
            Write-Host "Arquivo spec: $spec"
            Write-Host "Versão: $version"
            if (Test-Path $spec) {
              Write-Host "Executando ISCC..."
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" $spec
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Instalador criado com sucesso!"
              } else {
                Write-Warning "❌ Falha ao criar instalador. Código de saída: $LASTEXITCODE"
                exit 1
              }
            } else {
              Write-Warning "Arquivo de spec do Inno Setup não encontrado: $spec"
              exit 1
            }

      - store_artifacts:
          path: dist/
          destination: builds

      - store_artifacts:
          path: installer/Output/
          destination: installers

      - run:
          name: Create GitHub Pre-Release
          shell: powershell.exe -ExecutionPolicy Bypass
          when: on_success
          command: |
            Write-Host "Iniciando criação de pre-release no GitHub..." -ForegroundColor Green

            # Instala o GitHub CLI se não estiver presente
            if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
              Write-Host "Instalando GitHub CLI..." -ForegroundColor Yellow
              choco install gh --yes --no-progress
              # Atualiza o PATH após instalação
              refreshenv
            }

            # Verifica se o token do GitHub está disponível
            if ($env:GITHUB_TOKEN) {
              Write-Host "Autenticando no GitHub..." -ForegroundColor Cyan
              echo $env:GITHUB_TOKEN | gh auth login --with-token

              $buildType = "<< parameters.build-type >>"
              $releaseTag = "v$($env:PMT_BUILD_VERSION)"
              $releaseTitle = "PDF Tool $($env:PMT_BUILD_VERSION)"
              $installerName = "PDFMergeTool-$buildType-Setup.exe"
              $exeName = "pdf_merge_tool_win_$buildType.exe"
              
              $installerPath = "installer/Output/$installerName"
              $exePath = "dist/$exeName"

              # Verifica se os artefatos existem antes de criar a release
              if ((Test-Path $installerPath) -and (Test-Path $exePath)) {
                Write-Host "Criando pre-release '$releaseTag' com os artefatos..." -ForegroundColor Green
                gh release create $releaseTag `
                  --title $releaseTitle `
                  --notes "Build automático gerado pelo CircleCI. Versão: $buildType" `
                  --prerelease `
                  $exePath `
                  $installerPath
                
                Write-Host "✅ Pre-release criada com sucesso!" -ForegroundColor Green
              } else {
                Write-Warning "⚠️  Um ou mais artefatos não foram encontrados. Pulando criação da release."
                Write-Warning "  - Instalador esperado: $installerPath"
                Write-Warning "  - Executável esperado: $exePath"
              }
            } else {
              Write-Warning "⚠️  Variável GITHUB_TOKEN não configurada no CircleCI. A pre-release não será criada."
            }
