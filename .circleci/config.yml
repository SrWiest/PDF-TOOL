version: 2.1

workflows:
  build-and-release:
    jobs:
      - build_medium:
          filters:
            tags:
              only: /^v.*/  # Match any tag starting with 'v'
            branches:
              ignore: /.*/

jobs:
  build_medium:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    steps:
      - checkout

      - run:
          name: Setup Python 3.11
          command: |
            choco install python311 --yes
            export PATH="/c/Python311:/c/Python311/Scripts:$PATH"
            python -m pip install --upgrade pip setuptools wheel

      - run:
          name: Install Python dependencies
          command: |
            pip install pyinstaller
            pip install -r requirements/requirements-medium.txt
            pip freeze

      - run:
          name: Prepare external tools (Windows dependencies)
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Preparando ferramentas externas..." -ForegroundColor Green
            Write-Host "Instalando dependências adicionais para versão Medium..." -ForegroundColor Cyan

            # Instalar ferramentas adicionais necessárias para Medium
            $tools = @("qpdf", "poppler", "tesseract", "ghostscript", "mupdf")
            foreach ($tool in $tools) {
              Write-Host "Instalando $tool..." -ForegroundColor Yellow
              try {
                choco install $tool --yes --no-progress --force --force-dependencies
                Write-Host "✅ $tool instalado com sucesso" -ForegroundColor Green
              } catch {
                Write-Warning "Falha ao instalar $tool via Chocolatey: $($_.Exception.Message)"
              }
            }

            # Executar script de preparação
            .\.github\scripts\prepare-windows-deps.ps1

      - run:
          name: Prepare Image Tools (Poppler, ImageMagick)
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Configurando ferramentas de imagem..." -ForegroundColor Green
            try {
              .\.github\scripts\prepare-image-tools-deps.ps1
            } catch {
              Write-Host "Erro configurando image tools. Continuando sem elas..." -ForegroundColor Yellow
            }

      - run:
          name: Verify tools setup
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Verificando ferramentas instaladas..." -ForegroundColor Cyan
            Get-ChildItem third_party_full -Recurse -ErrorAction SilentlyContinue

      - run:
          name: DEBUG - List contents of third_party_full
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "--- DEBUG: Listing contents of third_party_full ---" -ForegroundColor Red
            Get-ChildItem -Path "third_party_full" -Recurse
            Write-Host "--- END DEBUG ---" -ForegroundColor Red

      - run:
          name: Build Medium executable with PyInstaller
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Construindo executável com PyInstaller..." -ForegroundColor Green
            pyinstaller specs/pdf_merge_medium.spec --clean

      - run:
          name: Setup Inno Setup
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Instalando Inno Setup..." -ForegroundColor Green
            choco install innosetup --yes

      - run:
          name: Create Windows Installer
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Criando instalador Windows..." -ForegroundColor Green
            ISCC.exe installer/install_medium.iss

      - store_artifacts:
          path: dist/
          destination: builds

      - store_artifacts:
          path: installer/Output/
          destination: installers

      - run:
          name: Create GitHub Release
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            Write-Host "Criando release no GitHub para o tag $env:CIRCLE_TAG" -ForegroundColor Green

            # Install GitHub CLI if not available
            if (!(Get-Command gh -ErrorAction SilentlyContinue)) {
              Write-Host "Instalando GitHub CLI..." -ForegroundColor Yellow
              choco install gh --yes
              refreshenv
            }

            # Check if GITHUB_TOKEN is available
            if ($env:GITHUB_TOKEN) {
              Write-Host "Autenticando com GitHub..." -ForegroundColor Cyan
              echo $env:GITHUB_TOKEN | gh auth login --with-token

              Write-Host "Criando release para o tag $env:CIRCLE_TAG..." -ForegroundColor Green
              $releaseNotes = @"
            ## PDF Tool Medium $env:CIRCLE_TAG

            ### ✅ Build Automático
            - Gerado automaticamente pelo CircleCI
            - Plataforma: Windows Server 2022
            - Python: 3.11

            ### 📦 Conteúdo
            - Executável standalone (pdf_merge_tool_win_medium.exe)
            - Instalador Windows (PDF_Tool_Medium_Setup.exe)

            ### 🔧 Funcionalidades
            - Merge de PDFs
            - OCR com Tesseract
            - Processamento de imagens
            - Recuperação de PDFs danificados

            ### ⚠️ Pre-release
            Esta é uma versão de pré-lançamento para testes.
            "@

              # Create the release in a single line to avoid PowerShell parser errors
              gh release create "$env:CIRCLE_TAG" --title "PDF Tool Medium $env:CIRCLE_TAG" --notes $releaseNotes --prerelease dist/pdf_merge_tool_win_medium/pdf_merge_tool_win_medium.exe installer/Output/PDFMergeTool-Medium-Setup.exe

              Write-Host "✅ Release $env:CIRCLE_TAG criada com sucesso!" -ForegroundColor Green
            } else {
              Write-Host "⚠️ GITHUB_TOKEN não configurado. Release não criado." -ForegroundColor Yellow
              Write-Host "Configure GITHUB_TOKEN nas variáveis de ambiente do CircleCI" -ForegroundColor Yellow
            }