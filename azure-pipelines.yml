trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  PMT_BUILD_VERSION: 'pre-release-medium-$(Build.BuildId)'
  pythonVersion: '3.11'

stages:
- stage: Build
  jobs:
  - job: BuildMedium
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true
        architecture: 'x64'

    - script: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pyinstaller
        pip install -r requirements/requirements-medium.txt
        pip freeze
      displayName: 'Install dependencies'

    - script: |
        echo "Building PDF Tool Medium version..."
        python -c "import sys; print(f'Python version: {sys.version}')"
        # Add your build commands here
      displayName: 'Build application'

    - task: PublishBuildArtifacts@1
      inputs:
        pathtoPublish: 'dist'
        artifactName: 'builds'
      displayName: 'Publish build artifacts'

- stage: Release
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: CreateRelease
    steps:
    - script: |
        echo "Creating release for version $(PMT_BUILD_VERSION)"
        # Add release creation logic here
      displayName: 'Create release'
